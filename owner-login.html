<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G&A Limited - Owner Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
<style>
body {
  font-family:'Roboto',sans-serif;
  background:#2c2c2c;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.container{
  background:#333;
  padding:40px;
  border-radius:15px;
  width:90%;
  max-width:400px;
  text-align:center;
}
h2{ font-family:'Playfair Display', serif; margin-bottom:30px; }
input{
  display:block;
  width:100%;
  padding:12px;
  margin-bottom:20px;
  border-radius:6px;
  border:1px solid #555;
  background:#444;
  color:#fff;
  font-size:1rem;
}
button{
  width:100%;
  padding:14px;
  background:#ff9800;
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:bold;
  font-size:1.1rem;
  cursor:pointer;
  transition:0.3s;
}
button:hover{ background:#e68900; }
.error{ color:#ff4d4d; margin-bottom:15px; display:none; }
</style>
</head>
<body>

<div class="container">
  <h2>Owner Login</h2>
  <div class="error" id="errorMsg">Invalid username or password!</div>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<script>
// Define your owner credentials here
const OWNER_USERNAME = "admin";
const OWNER_PASSWORD = "admin123";

function login(){
  const user=document.getElementById('username').value.trim();
  const pass=document.getElementById('password').value;

  if(user===OWNER_USERNAME && pass===OWNER_PASSWORD){
    localStorage.setItem('ownerLoggedIn', 'true'); // sets login flag
    window.location.href="owner-dashboard.html";   // redirect to dashboard
  } else {
    const error=document.getElementById('errorMsg');
    error.style.display='block';
  }
}
</script>

</body>
</html>
