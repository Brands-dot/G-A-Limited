<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G&A Limited - Customer Orders</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Roboto', sans-serif;
    background: #1f1f1f;
    color: #fff;
    margin: 0;
    padding: 20px;
}

h2 {
    text-align: center;
    font-family: 'Playfair Display', serif;
    margin-bottom: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

.order-card {
    background: #2b2b2b;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}

.order-card strong {
    display: block;
    margin-bottom: 8px;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin-right: 10px;
}

.complete-btn {
    background: #4caf50;
    color: white;
}

.complete-btn:hover {
    background: #45a049;
}

.delete-btn {
    background: #e53935;
    color: white;
}

.delete-btn:hover {
    background: #d32f2f;
}

.back-btn {
    background: #444;
    color: white;
    margin-bottom: 20px;
}

.back-btn:hover {
    background: #555;
}
</style>
</head>

<body>

<div class="container">

    <button class="back-btn" onclick="window.location.href='owner-dashboard.html'">⬅ Back to Dashboard</button>

    <h2>Customer Orders</h2>

    <div id="ordersContainer"></div>

</div>

<script>
if(localStorage.getItem("ownerLoggedIn") !== "true"){
    window.location.href = "owner-login.html";
}

let orders = JSON.parse(localStorage.getItem("orders")) || [];

function displayOrders() {
    const container = document.getElementById("ordersContainer");
    container.innerHTML = "";

    if (orders.length === 0) {
        container.innerHTML = "<p>No orders yet.</p>";
        return;
    }

    orders.forEach((order, index) => {
        const div = document.createElement("div");
        div.className = "order-card";

        div.innerHTML = `
            <strong>Customer Name:</strong> ${order.name}<br>
            <strong>Phone:</strong> ${order.phone}<br>
            <strong>Product:</strong> ${order.product}<br>
            <strong>Quantity:</strong> ${order.quantity}<br>
            <strong>Gauge:</strong> ${order.gauge || "N/A"}<br>
            <strong>Total Price:</strong> KES ${order.total}<br>
            <strong>Date:</strong> ${order.date}<br>
            <strong>Status:</strong> 
            <span style="color:${order.status === 'Completed' ? '#4caf50' : '#ffc107'}">
                ${order.status}
            </span>
            <br><br>

            <button class="complete-btn" onclick="markCompleted(${index})">Mark as Completed</button>
            <button class="delete-btn" onclick="deleteOrder(${index})">Delete</button>
        `;
        container.appendChild(div);
    });
}

function markCompleted(index){
    orders[index].status = "Completed";
    localStorage.setItem("orders", JSON.stringify(orders));
    displayOrders();
}

function deleteOrder(index){
    if(!confirm("Are you sure you want to delete this order?")) return;

    orders.splice(index, 1);
    localStorage.setItem("orders", JSON.stringify(orders));
    displayOrders();
}

window.onload = displayOrders;
</script>

</body>
</html>
