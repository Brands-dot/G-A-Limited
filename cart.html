<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | G&A Limited</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Roboto',sans-serif;
  background:#f4f4f9;
  color:#333;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* HEADER */
header{
  background:#222;
  color:#fff;
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}
header a{
  color:#fff;
  text-decoration:none;
  margin-left:20px;
  font-weight:500;
}
header a:hover{color:#ff9800;}
.logo{
  font-family:'Playfair Display', serif;
  font-size:1.8rem;
}

/* MAIN */
.container{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
  flex:1;
}
h2{
  font-family:'Playfair Display', serif;
  text-align:center;
  margin-bottom:20px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:20px;
}
th,td{
  border:1px solid #ddd;
  padding:12px;
  text-align:center;
}
th{
  background:#ff9800;
  color:#fff;
}
tr:nth-child(even){background:#fafafa;}

input[type="number"]{
  width:60px;
  padding:5px;
}

/* BUTTON */
.btn{
  padding:10px 20px;
  background:#ff9800;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}
.btn:hover{background:#e68900;}

/* CHECKOUT FORM */
.checkout-form{
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  margin-top:30px;
}
.checkout-form label{font-weight:bold;}
.checkout-form input,
.checkout-form textarea,
.checkout-form select{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* FOOTER */
footer{
  background:#222;
  color:#fff;
  text-align:center;
  padding:25px;
  margin-top:auto;
}

/* TOAST */
#toastContainer{
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.toast{
  padding:15px 20px;
  border-radius:8px;
  color:#fff;
  font-weight:500;
}
.toast.success{background:#4caf50;}
.toast.error{background:#d63031;}
.toast.info{background:#2196f3;}

@media(max-width:768px){
  th,td{font-size:0.85rem;padding:8px;}
}
</style>
</head>

<body>

<header>
  <div class="logo">G&A Limited</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">
      Cart (<span id="cartCount">0</span>)
    </a>
  </nav>
</header>

<div class="container">
  <h2>Shopping Cart</h2>

  <table id="cartTable">
    <thead>
      <tr>
        <th>Product</th>
        <th>Gauge</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h3 id="grandTotal">Grand Total: KES 0</h3>
  <button class="btn" id="checkoutBtn">Proceed to Checkout</button>

  <!-- CHECKOUT -->
  <div id="checkoutSection" style="display:none;">
    <h2>Checkout</h2>

    <div class="checkout-form">
      <label>Full Name</label>
      <input id="custName" placeholder="John Doe">

      <label>Phone</label>
      <input id="custPhone" placeholder="+254 7xx xxx xxx">

      <label>Email</label>
      <input id="custEmail" type="email">

      <label>Delivery Address</label>
      <textarea id="custAddress"></textarea>

      <label>Payment Method</label>
      <select id="paymentMethod">
        <option value="Cash on Delivery">Cash on Delivery</option>
        <option value="M-PESA">M-PESA</option>
      </select>

      <button class="btn" id="placeOrderBtn">Place Order</button>
    </div>
  </div>
</div>

<footer>
  <p>Contact: info@galimited.com | +254 700 000 000</p>
  <p>&copy; 2025 G&A Limited</p>
</footer>

<div id="toastContainer"></div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

const tbody = document.querySelector("#cartTable tbody");
const grandTotalEl = document.getElementById("grandTotal");
const cartCountEl = document.getElementById("cartCount");
const checkoutSection = document.getElementById("checkoutSection");

/* TOAST */
function toast(msg,type="info"){
  const t=document.createElement("div");
  t.className=`toast ${type}`;
  t.textContent=msg;
  document.getElementById("toastContainer").appendChild(t);
  setTimeout(()=>t.remove(),3500);
}

/* RENDER CART */
function renderCart(){
  tbody.innerHTML="";
  let total=0;

  cart.forEach((item,i)=>{
    const itemTotal=item.price*item.quantity;
    total+=itemTotal;

    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${item.name}</td>
      <td>${item.gauge||"—"}</td>
      <td><input type="number" min="1" value="${item.quantity}" onchange="updateQty(${i},this.value)"></td>
      <td>KES ${item.price}</td>
      <td>KES ${itemTotal}</td>
      <td><button class="btn" onclick="removeItem(${i})">Remove</button></td>
    `;
    tbody.appendChild(tr);
  });

  grandTotalEl.textContent="Grand Total: KES "+total;
  cartCountEl.textContent=cart.reduce((s,i)=>s+i.quantity,0);
  localStorage.setItem("cart",JSON.stringify(cart));
}

/* UPDATE */
function updateQty(i,val){
  cart[i].quantity=parseInt(val);
  renderCart();
}

/* REMOVE */
function removeItem(i){
  cart.splice(i,1);
  toast("Item removed","info");
  renderCart();
}

/* CHECKOUT */
document.getElementById("checkoutBtn").onclick=()=>{
  if(!cart.length){ toast("Cart is empty","error"); return; }
  checkoutSection.style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
};

/* PLACE ORDER */
document.getElementById("placeOrderBtn").onclick=()=>{
  const name=custName.value.trim();
  const phone=custPhone.value.trim();
  const email=custEmail.value.trim();
  const address=custAddress.value.trim();

  if(!name||!phone||!email||!address){
    toast("Please fill all details","error");
    return;
  }

  const orders=JSON.parse(localStorage.getItem("orders"))||[];
  orders.push({
    customer:{name,phone,email,address},
    items:cart,
    total:cart.reduce((s,i)=>s+i.price*i.quantity,0),
    date:new Date().toLocaleString()
  });

  localStorage.setItem("orders",JSON.stringify(orders));
  toast("Order placed successfully","success");

  cart=[];
  renderCart();
  checkoutSection.style.display="none";
};

renderCart();
</script>

</body>
</html>
