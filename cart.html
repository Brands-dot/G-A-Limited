<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G&A Limited - Checkout</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Roboto',sans-serif;background:#f4f4f9;color:#333;display:flex;flex-direction:column;min-height:100vh;}
header{background:#222;color:#fff;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;}
header a{color:#fff;text-decoration:none;margin-left:20px;font-weight:500;transition:0.3s;}
header a:hover{color:#ff9800;}
.logo{font-family:'Playfair Display', serif;font-size:1.8rem;font-weight:bold;}
.container{max-width:900px;margin:50px auto;padding:0 20px;flex:1;}
h2{font-family:'Playfair Display', serif;font-size:2rem;margin-bottom:20px;text-align:center;color:#222;}
table{width:100%;border-collapse:collapse;margin-bottom:20px;}
th,td{border:1px solid #ccc;padding:12px;text-align:center;}
th{background:#ff9800;color:#fff;}
tr:nth-child(even){background:#f9f9f9;}
.btn{display:inline-block;padding:10px 20px;background:#ff9800;color:#fff;border-radius:8px;text-decoration:none;font-weight:bold;cursor:pointer;transition:0.3s;}
.btn:hover{background:#e68900;}
.checkout-form{background:#fff;padding:20px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,0.1);}
.checkout-form input, .checkout-form select, .checkout-form textarea{width:100%;padding:12px;margin-bottom:15px;border-radius:6px;border:1px solid #ccc;font-size:1rem;}
.checkout-form h3{margin-bottom:15px;color:#222;}
.checkout-form label{font-weight:bold;}
footer{background:#222;color:#fff;text-align:center;padding:25px;margin-top:auto;}
@media(max-width:768px){table, th, td{font-size:0.9rem;}th, td{padding:8px;}.checkout-form input, .checkout-form select, .checkout-form textarea{padding:10px;font-size:0.9rem;}}

/* Toast styles */
#toastContainer{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;}
.toast{min-width:250px;max-width:350px;padding:15px 20px;border-radius:8px;color:#fff;font-weight:500;box-shadow:0 5px 15px rgba(0,0,0,0.2);animation:slideIn 0.5s, fadeOut 0.5s 3.5s forwards;opacity:0;}
.toast.success{background:#4caf50;}
.toast.error{background:#d63031;}
.toast.info{background:#2196f3;}
@keyframes slideIn{0%{transform:translateX(100%);opacity:0;}100%{transform:translateX(0);opacity:1;}}
@keyframes fadeOut{0%{opacity:1;}100%{opacity:0;}}
</style>
</head>
<body>

<header>
  <div class="logo">G&A Limited</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html" style="position:relative;">
      Cart 
      <span id="cartCount" style="
        position:absolute;
        top:-8px;
        right:-10px;
        background:#ff9800;
        color:#fff;
        font-size:0.8rem;
        padding:2px 6px;
        border-radius:50%;
        font-weight:bold;
      ">0</span>
    </a>
  </nav>
</header>

<div class="container">
  <h2>Shopping Cart</h2>
  <table id="cartTable">
    <thead>
      <tr>
        <th>Product</th>
        <th>Gauge</th>
        <th>Qty</th>
        <th>Price</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <h3 id="grandTotal">Grand Total: KES 0</h3>
  <button class="btn" id="checkoutBtn">Proceed to Checkout</button>

  <div id="checkoutSection" style="display:none;">
    <h2>Checkout</h2>
    <div class="checkout-form">
      <h3>Customer Details</h3>
      <label for="custName">Full Name</label>
      <input type="text" id="custName" placeholder="John Doe">
      <label for="custPhone">Phone Number</label>
      <input type="text" id="custPhone" placeholder="+254 700 000 000">
      <label for="custEmail">Email</label>
      <input type="email" id="custEmail" placeholder="example@mail.com">
      <label for="custAddress">Delivery Address</label>
      <textarea id="custAddress" placeholder="Enter your delivery address"></textarea>
      <label for="paymentMethod">Payment Method</label>
      <select id="paymentMethod">
        <option value="cod">Cash on Delivery</option>
        <option value="mpesa">M-PESA</option>
      </select>
      <button class="btn" id="placeOrderBtn">Place Order</button>
    </div>
  </div>
</div>

<footer>
  <p>Contact us: info@galimited.com | +254 700 000 000</p>
  <p>&copy; 2025 G&A Limited. All rights reserved.</p>
</footer>

<!-- Toast container -->
<div id="toastContainer"></div>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];
const cartTableBody = document.querySelector('#cartTable tbody');
const grandTotalEl = document.getElementById('grandTotal');
const checkoutBtn = document.getElementById('checkoutBtn');
const checkoutSection = document.getElementById('checkoutSection');

// Toast
function showToast(message,type='info',duration=4000){
  const container=document.getElementById('toastContainer');
  const toast=document.createElement('div');
  toast.className=`toast ${type}`;
  toast.textContent=message;
  container.appendChild(toast);
  setTimeout(()=>{ toast.style.opacity='1'; },50);
  setTimeout(()=>{ toast.remove(); },duration);
}

// Render cart
function renderCart(){
  cartTableBody.innerHTML='';
  let grandTotal=0;
  cart.forEach((item,index)=>{
    const total = item.price * item.quantity;
    grandTotal += total;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.name}</td>
      <td>${item.gauge||'None'}</td>
      <td><input type="number" value="${item.quantity}" min="1" style="width:60px;" onchange="updateQty(${index},this.value)"></td>
      <td>${item.price}</td>
      <td>${total}</td>
      <td><button class="btn" onclick="removeItem(${index})">Remove</button></td>
    `;
    cartTableBody.appendChild(tr);
  });
  grandTotalEl.textContent = `Grand Total: KES ${grandTotal}`;
  localStorage.setItem('cart', JSON.stringify(cart));
}

// Update quantity
function updateQty(index,value){
  const qty = parseInt(value);
  if(qty < 1) return;
  cart[index].quantity = qty;
  renderCart();
}

// Remove item
function removeItem(index){
  cart.splice(index,1);
  renderCart();
  showToast('Item removed from cart','info');
}

// Checkout
checkoutBtn.onclick = ()=>{
  if(cart.length===0){ showToast('Cart is empty!','error'); return; }
  checkoutSection.style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
};

// Place order
document.getElementById('placeOrderBtn').onclick = ()=>{
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const email = document.getElementById('custEmail').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  const payment = document.getElementById('paymentMethod').value;

  if(!name || !phone || !email || !address){
    showToast('Please fill all customer details','error');
    return;
  }

  const order = {
    customer: { name, phone, email, address, payment },
    items: cart,
    total: cart.reduce((sum,item)=>sum + item.price*item.quantity,0),
    time: new Date().toLocaleString(),
    completed: false
  };

  const orders = JSON.parse(localStorage.getItem('orders')) || [];
  orders.push(order);
  localStorage.setItem('orders', JSON.stringify(orders));

  showToast('Order placed successfully!','success');
  cart = [];
  renderCart();
  checkoutSection.style.display='none';
};

renderCart();

// Function to update cart count in header
function updateCartCount(){
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
  const cartEl = document.getElementById('cartCount');
  if(cartEl) cartEl.textContent = cartCount;
}

// Call on page load
updateCartCount();

// Optional: also call after cart changes
function addToCart(item){
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  cart.push(item);
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartCount();
}

// If you use quantity changes/removals, call updateCartCount() there too

</script>
</body>
</html>
