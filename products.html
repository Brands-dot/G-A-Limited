<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products | G&A Limited</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Roboto',sans-serif;
  background:#f4f4f9;
  color:#333;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* HEADER */
header{
  background:#222;
  color:#fff;
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:100;
}
header a{
  color:#fff;
  text-decoration:none;
  margin-left:20px;
  transition:0.3s;
  font-weight:500;
}
header a:hover{color:#ff9800;}
.logo{
  font-family:'Playfair Display', serif;
  font-size:1.8rem;
}

/* MAIN */
.container{
  max-width:1200px;
  margin:50px auto;
  padding:0 20px;
  flex:1;
}
h2{
  font-family:'Playfair Display', serif;
  font-size:2.5rem;
  margin-bottom:40px;
  text-align:center;
}

/* GRID */
.grid{
  display:flex;
  flex-wrap:wrap;
  gap:30px;
  justify-content:center;
}

/* CARD */
.card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  width:300px;
  transition:0.3s;
  cursor:pointer;
}
.card:hover{
  transform:translateY(-8px);
  box-shadow:0 15px 30px rgba(0,0,0,0.2);
}
.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}
.card-content{
  padding:20px;
}
.card-content h3{
  font-family:'Playfair Display', serif;
  font-size:1.5rem;
  margin-bottom:10px;
}
.card-content p{
  margin-bottom:10px;
  color:#555;
}

/* BUTTON */
.btn{
  display:inline-block;
  padding:12px 25px;
  background:#ff9800;
  color:#fff;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  cursor:pointer;
}
.btn:hover{background:#e68900;}

/* BACK */
.back{
  margin-top:20px;
  display:inline-block;
  color:#ff9800;
  cursor:pointer;
}

/* FOOTER */
footer{
  background:#222;
  color:#fff;
  text-align:center;
  padding:25px;
  margin-top:auto;
}

/* MODAL */
#modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}
.modal-box{
  background:#fff;
  width:90%;
  max-width:500px;
  border-radius:15px;
  padding:20px;
  text-align:center;
}
.modal-box img{
  width:100%;
  height:250px;
  object-fit:cover;
  border-radius:12px;
}
.modal-box select,
.modal-box input{
  width:80%;
  padding:10px;
  margin:10px 0;
}
.close-btn{
  margin-top:15px;
  background:#222;
  color:#fff;
}

/* TOAST */
#toastContainer{
  position:fixed;
  top:20px;
  right:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:1000;
}
.toast{
  padding:15px 20px;
  border-radius:10px;
  color:#fff;
  font-weight:bold;
  opacity:0;
  transform:translateY(-10px);
  transition:0.3s;
}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:#4caf50;}
.toast.info{background:#2196f3;}

@media(max-width:768px){
  .card{width:90%;}
}
</style>
</head>

<body>

<header>
  <div class="logo">G&A Limited</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="cart.html">Cart</a>
  </nav>
</header>

<div class="container">
  <h2 id="title">Product Categories</h2>

  <div class="grid" id="categories"></div>
  <div class="grid" id="products" style="display:none;"></div>

  <span class="back" id="backBtn" style="display:none;">← Back to Categories</span>
</div>

<footer>
  <p>Contact: info@galimited.com | +254 700 000 000</p>
  <p>&copy; 2025 G&A Limited</p>
</footer>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <img id="modalImg">
    <h2 id="modalName"></h2>
    <p id="modalDesc"></p>
    <p><strong id="modalPrice"></strong></p>

    <label>Gauge</label>
    <select id="modalGauge"></select>

    <label>Quantity</label>
    <input type="number" id="modalQty" value="1" min="1">

    <button class="btn" id="addBtn">Add to Cart</button>
    <button class="btn close-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<div id="toastContainer"></div>

<script>
const categories = JSON.parse(localStorage.getItem("categories")) || [];
const products = JSON.parse(localStorage.getItem("products")) || [];

const categoriesDiv = document.getElementById("categories");
const productsDiv = document.getElementById("products");
const title = document.getElementById("title");
const backBtn = document.getElementById("backBtn");

const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");
const modalName = document.getElementById("modalName");
const modalDesc = document.getElementById("modalDesc");
const modalPrice = document.getElementById("modalPrice");
const modalGauge = document.getElementById("modalGauge");
const modalQty = document.getElementById("modalQty");
const addBtn = document.getElementById("addBtn");

function toast(msg,type="info"){
  const t=document.createElement("div");
  t.className=`toast ${type} show`;
  t.textContent=msg;
  document.getElementById("toastContainer").appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

function showCategories(){
  title.textContent="Product Categories";
  categoriesDiv.style.display="flex";
  productsDiv.style.display="none";
  backBtn.style.display="none";
}

function showProducts(cat){
  title.textContent=cat+" Products";
  categoriesDiv.style.display="none";
  productsDiv.style.display="flex";
  backBtn.style.display="inline-block";
  productsDiv.innerHTML="";

  products.filter(p=>p.category===cat).forEach(p=>{
    const c=document.createElement("div");
    c.className="card";
    c.innerHTML=`
      <img src="${p.img}">
      <div class="card-content">
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <p><strong>KES ${p.price}</strong></p>
        <span class="btn">View</span>
      </div>`;
    c.onclick=()=>openModal(p);
    productsDiv.appendChild(c);
  });
}

function openModal(p){
  modalImg.src=p.img;
  modalName.textContent=p.name;
  modalDesc.textContent=p.desc;
  modalPrice.textContent="KES "+p.price;

  modalGauge.innerHTML="";
  (p.gauges.length?p.gauges:["None"]).forEach(g=>{
    const o=document.createElement("option");
    o.textContent=g;
    modalGauge.appendChild(o);
  });

  addBtn.onclick=()=>{
    const cart=JSON.parse(localStorage.getItem("cart"))||[];
    cart.push({name:p.name,price:p.price,qty:modalQty.value,img:p.img});
    localStorage.setItem("cart",JSON.stringify(cart));
    toast("Added to cart","success");
    closeModal();
  };

  modal.style.display="flex";
}

function closeModal(){ modal.style.display="none"; }

backBtn.onclick=showCategories;

function loadCategories(){
  if(!categories.length){
    categoriesDiv.innerHTML="<p>No categories added yet.</p>";
    return;
  }
  categories.forEach(c=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <img src="${c.img}">
      <div class="card-content"><h3>${c.name}</h3></div>`;
    card.onclick=()=>showProducts(c.name);
    categoriesDiv.appendChild(card);
  });
}

loadCategories();
</script>

</body>
</html>
