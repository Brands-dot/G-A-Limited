<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G&A Limited - Products</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">

  <style>
    /* Reset */
    * { margin:0; padding:0; box-sizing:border-box; }

    /* Flex layout to push footer to bottom */
    html, body { height: 100%; font-family: 'Roboto', sans-serif; background: #f4f4f9; color: #333; display: flex; flex-direction: column; }

    body > .container { flex: 1; }

    /* Header */
    header {
      background: #222;
      color: #fff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header a { color: #fff; text-decoration: none; margin-left: 20px; transition: 0.3s; font-weight: 500; }
    header a:hover { color: #ff9800; }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: bold; }

    /* Container */
    .container { max-width: 1200px; margin: 50px auto; padding: 0 20px; }

    h2 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 40px; text-align: center; color: #222; }

    /* Product grid */
    .product-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 300px;
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-content {
      padding: 20px;
      flex: 1;
    }

    .card-content h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: #222;
    }

    .card-content p {
      font-size: 1rem;
      margin-bottom: 20px;
      color: #555;
    }

    .card-content .btn {
      display: inline-block;
      padding: 12px 25px;
      background: #ff9800;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .card-content .btn:hover { background: #e68900; }

    /* Footer */
    footer {
      background: #222;
      color: #fff;
      text-align: center;
      padding: 25px;
      margin-top: 50px;
    }

    /* Responsive */
    @media(max-width:1024px){ .card { width: 45%; } }
    @media(max-width:768px){ .card { width: 90%; } }

  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">G&A Limited</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="#productGrid">Products</a>
      <a href="#help">Help</a>
    </nav>
  </header>

  <!-- Container -->
  <div class="container">
    <h2>Our Products</h2>
    <div class="product-grid" id="productGrid">
      <!-- Product cards generated by JS -->
    </div>
  </div>

  <!-- Footer -->
  <footer id="contact">
    <p>Contact us: info@galimited.com | +254 700 000 000</p>
    <p>&copy; 2025 G&A Limited. All rights reserved.</p>
  </footer>

  <!-- Script: Dynamic Products -->
  <script>
    const products = [
      { name: "Steel", category: "Steel", img: "images/steel.jpeg", desc: "Premium steel rods and sheets suitable for construction and industrial use." },
      { name: "Solar Products", category: "Solar", img: "images/solar.jpeg", desc: "High-efficiency panels for residential and commercial solar installations." }
    ];

    const grid = document.getElementById("productGrid");

    products.forEach(product => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${product.img}" alt="${product.name}">
        <div class="card-content">
          <h3>${product.name}</h3>
          <p>${product.desc}</p>
          <a href="#contact" class="btn">View</a>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>

</body>
</html>
