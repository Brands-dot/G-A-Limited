<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>G&A Limited - Owner Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Roboto',sans-serif;
  background:#1f1f1f;
  color:#f4f4f9;
  padding:20px;
  margin:0;
}
h2,h3{
  font-family:'Playfair Display', serif;
  text-align:center;
  margin-bottom:20px;
}
.container{ max-width:1000px; margin:auto; }

input,textarea,select{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  background:#333;
  border:1px solid #555;
  border-radius:6px;
  color:#fff;
}

button{
  background:#ff9800;
  color:#fff;
  border:none;
  padding:14px 25px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.small-btn{
  padding:8px 10px;
  margin:5px;
  border-radius:6px;
  font-weight:bold;
}
.edit-btn{ background:#ffaa00; color:#111; }
.del-btn{ background:#d63031; color:#fff; }
.mark-btn{ background:#4caf50; color:#fff; }

.category-list,.product-list,.order-list{
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  justify-content:center;
}

.category-card,.product-card,.order-card{
  background:#2c2c2c;
  padding:15px;
  border-radius:10px;
  width:260px;
}

.logout{
  float:right;
  background:#222;
  padding:10px 15px;
  border-radius:5px;
  cursor:pointer;
}

/* ---------- TOAST ---------- */
#toastContainer{
  position:fixed;
  top:20px;
  right:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:9999;
}

.toast{
  background:#333;
  padding:15px 20px;
  border-radius:10px;
  min-width:280px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  animation:slideIn .3s ease;
}

.toast.success{ background:#4caf50; }
.toast.error{ background:#d63031; }
.toast.info{ background:#2196f3; }

.toast-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:10px;
}

.toast button{
  padding:6px 12px;
  border-radius:6px;
  font-size:.9rem;
}

@keyframes slideIn{
  from{ opacity:0; transform:translateY(-10px); }
  to{ opacity:1; transform:translateY(0); }
}
</style>
</head>

<body>

<div class="container">
  <h2>Owner Dashboard</h2>
  <button class="logout" onclick="logout()">Logout</button>

  <h3>Customer Orders</h3>
  <div class="order-list" id="orderList"></div>
</div>

<div id="toastContainer"></div>

<script>
/* ---------------- AUTH ---------------- */
if(localStorage.getItem("ownerLoggedIn")!=="true"){
  location.href="owner-login.html";
}

let orders = JSON.parse(localStorage.getItem("orders")) || [];

/* ---------------- TOAST ---------------- */
function showToast(msg,type="info",actions=null){
  const t=document.createElement("div");
  t.className=`toast ${type}`;
  t.innerHTML=`<div>${msg}</div>`;

  if(actions){
    const act=document.createElement("div");
    act.className="toast-actions";
    actions.forEach(a=>{
      const b=document.createElement("button");
      b.textContent=a.text;
      b.onclick=()=>{ a.action(); t.remove(); };
      act.appendChild(b);
    });
    t.appendChild(act);
  } else {
    setTimeout(()=>t.remove(),3000);
  }

  document.getElementById("toastContainer").appendChild(t);
}

/* ---------------- ORDERS ---------------- */
function displayOrders(){
  const list=document.getElementById("orderList");
  list.innerHTML="";

  if(orders.length===0){
    list.innerHTML="<p>No orders yet.</p>";
    return;
  }

  orders.slice().reverse().forEach((o,ri)=>{
    const i=orders.length-1-ri;
    const d=document.createElement("div");
    d.className="order-card";

    let items="";
    o.items.forEach(it=>{
      items+=`
        <b>${it.name}</b><br>
        Qty: ${it.quantity}<br>
        Total: KES ${it.price*it.quantity}<hr>
      `;
    });

    d.innerHTML=`
      ${items}
      <b>Customer:</b><br>
      ${o.customer.name}<br>
      ${o.customer.phone}<br>
      ${o.customer.email}<br><br>

      <button class="small-btn del-btn" onclick="confirmDeleteOrder(${i})">Delete</button>
      <button class="small-btn mark-btn" onclick="toggleCompleted(${i})">
        ${o.completed?"Completed ✓":"Mark Completed"}
      </button>
    `;
    list.appendChild(d);
  });
}

function confirmDeleteOrder(i){
  showToast(
    "Delete this order?",
    "error",
    [
      { text:"Cancel", action:()=>{} },
      { text:"Delete", action:()=>deleteOrder(i) }
    ]
  );
}

function deleteOrder(i){
  orders.splice(i,1);
  localStorage.setItem("orders",JSON.stringify(orders));
  displayOrders();
  showToast("Order deleted","success");
}

function toggleCompleted(i){
  orders[i].completed=!orders[i].completed;
  localStorage.setItem("orders",JSON.stringify(orders));
  displayOrders();
  showToast("Order updated","info");
}

function logout(){
  localStorage.removeItem("ownerLoggedIn");
  location.href="owner-login.html";
}

displayOrders();
</script>
</body>
</html>
