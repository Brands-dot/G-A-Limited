<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G&A Limited</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400&display=swap" rel="stylesheet">

<style>
  /* Reset */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; font-family:'Roboto', sans-serif; scroll-behavior:smooth; }

  /* Hero Section */
  .hero {
    height: 100vh;
    background: url('images/20231105_122343-scaled.jpg') no-repeat center center/cover;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #fff;
  }

  .hero::after {
    content: '';
    position: absolute;
    top:0; left:0;
    width:100%; height:100%;
    background-color: rgba(0,0,0,0.55);
    z-index:0;
  }

  .hero-content {
    position: relative;
    z-index:1;
    padding: 0 20px;
    max-width: 700px;
  }

  h1 {
    font-family:'Playfair Display', serif;
    font-size:4rem;
    margin-bottom:20px;
    text-shadow: 3px 3px 8px rgba(0,0,0,0.7);
  }

  p {
    font-size:1.3rem;
    margin-bottom:30px;
    line-height:1.6;
    text-shadow:2px 2px 6px rgba(0,0,0,0.6);
  }

  .btn {
    display:inline-block;
    padding:15px 35px;
    background:#ff9800;
    color:#fff;
    font-weight:bold;
    border-radius:6px;
    text-decoration:none;
    font-size:1.1rem;
    transition:0.3s;
  }

  .btn:hover {
    background:#e68900;
  }

  /* Footer */
  footer {
    background:#111;
    color:#fff;
    text-align:center;
    padding:20px 10px;
    font-size:0.9rem;
  }

  footer a {
    color:#ff9800;
    text-decoration:none;
  }
  footer a:hover { text-decoration:underline; }

  /* Responsive */
  @media(max-width:1024px){
    h1 { font-size:3rem; }
    p { font-size:1.1rem; }
    .btn { font-size:1rem; padding:12px 30px; }
  }

  @media(max-width:768px){
    h1 { font-size:2.2rem; }
    p { font-size:1rem; }
    .btn { font-size:0.95rem; padding:10px 25px; }
  }

</style>
</head>
<body>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>G&A Limited</h1>
      <p>Delivering quality steel products, reliable solar solutions, and innovative aesthetic designs. Let’s power your projects and transform spaces together.</p>
      <a href="products.html" class="btn">Explore Products</a>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>Contact us: <a href="mailto:info@galimited.com">info@galimited.com</a> | +254 700 000 000</p>
    <p>&copy; 2025 G&A Limited. All rights reserved.</p>
  </footer>

</body>
</html>
